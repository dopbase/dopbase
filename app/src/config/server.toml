# Dopbase server configuration
#
# Uncomment a setting to change it.
# Priority: CLI options > environment variables > this file > defaults.
# Restart the server after editing this file.

# Configuration schema version. Supported value: 1.
# version = 1

# Network interface to listen on.
# Default: "127.0.0.1" (local connections only).
# Examples: "localhost", "0.0.0.0", "192.168.1.20".
# Use "0.0.0.0" to listen on all IPv4 interfaces.
# Environment: DOPBASE_HOST
# host = "127.0.0.1"

# Port to listen on.
# Default: {{PORT}}. Example: 9000.
# Environment: DOPBASE_PORT
# port = {{PORT}}

# Address clients use to reach this server.
# Accepts an absolute HTTP or HTTPS URL.
# Examples: "http://localhost:9000", "https://dopbase.example.com".
# When omitted, local binds use http://localhost:<port>.
# Network binds show http://SERVER_HOST:<port> until you set this.
# Environment: DOPBASE_PUBLIC_URL
# public_url = "{{PUBLIC_URL}}"

# Seconds to wait for in-flight requests during shutdown.
# Accepts: 1 to 300. Default: 10.
# Environment: DOPBASE_SHUTDOWN_GRACE_SECONDS
# shutdown_grace_seconds = 10

# Days to keep audit records. Older records are moved to the
# audit-archive directory in the data directory.
# Accepts: 1 or more. Remove this line to keep records forever.
# Environment: DOPBASE_AUDIT_RETENTION_DAYS
audit_retention_days = 365

# Reverse proxies allowed to report the client address. Audit records
# store the connection's address unless it comes from one of these, in
# which case the X-Forwarded-For header is read instead. List only
# proxies you run: any address listed here can claim to be any client.
# Accepts: IP addresses or CIDR networks. Default: none.
# Environment: DOPBASE_TRUSTED_PROXIES (comma-separated)
# trusted_proxies = ["127.0.0.1", "10.0.0.0/8"]

# Enable the web UI. The CLI and REST API remain available when disabled.
# Accepts: true or false. Default: true.
# Environment: DOPBASE_WEB_UI
# web_ui = true

# Enable Swagger UI at /api/docs.
# Accepts: true or false. Default: false.
# Environment: DOPBASE_DOCS
# docs = false

# Trusted OIDC identity providers (optional). A token is accepted only from a
# listed issuer, only for a listed audience, and only when the signature
# verifies against the provider's published JWKS.
# Uncomment the table header before enabling providers below.
# [oidc]

# A trusted provider. Repeat the table header for each issuer.
# [[oidc.issuers]]

# Exact "iss" value the provider puts in its tokens. Must be an absolute
# HTTPS URL; HTTP is accepted for a loopback host during development.
# issuer = "https://auth.example.com"

# Accepted audiences. A token must list at least one of these in "aud".
# audiences = ["dopbase"]

# Accepted signature algorithms. Default: ["RS256"].
# Symmetric algorithms (HS256, HS384, HS512) are rejected.
# algorithms = ["RS256"]

# JWKS endpoint. Default: discovered from the issuer's
# /.well-known/openid-configuration document.
# jwks_uri = "https://auth.example.com/.well-known/jwks.json"

# Browser single sign-on for the admin UI (optional). Requires an issuer listed
# above. Accounts are created by an administrator and linked to the provider on
# first sign-in by verified email; unknown emails are refused.
# Uncomment the table header before enabling it below.
# [oidc.login]

# Exact "issuer" from a trusted provider above.
# issuer = "https://auth.example.com"

# OAuth client registered with the provider.
# client_id = "dopbase"

# Client secret. Omit it (with token_endpoint_auth_method = "none") for a public
# client that relies on PKCE alone.
# client_secret = ""

# Callback URL. Default: "{public_url}/api/v1/auth/oidc/callback".
# redirect_uri = "https://dopbase.example.com/api/v1/auth/oidc/callback"

# Requested scopes. Default: ["openid", "profile", "email"]. Must include "openid".
# scopes = ["openid", "profile", "email"]

# Claim that carries group membership. Default: "groups".
# groups_claim = "groups"

# Claim that carries the account email. Default: "email".
# email_claim = "email"

# Require the provider to assert "email_verified". Default: true.
# require_email_verified = true

# Token endpoint client authentication. Accepts client_secret_basic,
# client_secret_post, or none. Default: basic when a secret is set, and
# none (PKCE only) otherwise.
# token_endpoint_auth_method = "client_secret_basic"

# Group-to-role mapping. A sign-in must match one entry. Only the admin and
# member roles can be granted this way. Quote a group name that contains spaces
# or punctuation.
# [oidc.login.roles]
# dopbase-admins = "admin"
# dopbase-members = "member"

# Master encryption key settings.
# Uncomment the table header before enabling settings below.
# [master_key]

# Key storage provider. Supported value: "file".
# provider = "file"

# Location of the master encryption key file.
# Default: master.key inside the selected data directory.
# Accepts an absolute path, a ~/ path, or a path relative
# to the directory where Dopbase starts.
# Example: "/etc/dopbase/master.key".
# Environment: DOPBASE_MASTER_KEY_PATH
