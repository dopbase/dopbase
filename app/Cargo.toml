[package]
name = "app"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "dopbase"
path = "src/main.rs"

[dependencies]
# Async runtime (required by axum / sqlx)
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "net",
  "process",
  "io-util",
] }
# HTTP server / REST API
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "matched-path",
  "multipart",
  "query",
  "tokio",
  "tracing",
] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tower-http = { version = "0.7", features = [
  "request-id",
  "timeout",
  "trace",
] }
# API Documentation
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
# SQLite driver, connection pool, and runtime migrations
sqlx = { version = "0.8", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "migrate",
  "macros",
  "json",
] }
# CLI subcommands (serve, login, run, ...)
clap = { version = "4", features = ["derive"] }
anstream = "1"
anstyle = "1"
inquire = "0.9"
# Serialization for the REST API
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
url = "2"
# Authentication tokens
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "multipart",
] }
# Envelope encryption (authenticated encryption)
chacha20poly1305 = "0.10"
# Human-user authentication (password hashing)
argon2 = "0.5"
# Timestamps (audit records, token metadata)
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
base64 = "0.22"
hex = "0.4"
getrandom = "0.3"
hkdf = "0.12"
mime_guess = "2"
regex = "1"
rust-embed = "8"
sha2 = "0.10"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
zeroize = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process", "fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
