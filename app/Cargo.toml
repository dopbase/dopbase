[package]
name = "app"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# Async runtime (required by axum / sqlx)
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "net",
] }
# HTTP server / REST API
axum = "0.8"
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7", features = [
  "cors",
  "limit",
  "request-id",
  "set-header",
  "timeout",
  "trace",
  "util",
] }
# SQLite driver, connection pool, and runtime migrations
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
# CLI subcommands (serve, login, run, ...)
clap = { version = "4", features = ["derive"] }
# Serialization for the REST API
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Field Validator
validator = { version = "0.21", features = ["derive"] }
# Authentication tokens
jsonwebtoken = "9"
# Typed error definitions (stable error shapes)
thiserror = "2"
# Envelope encryption (authenticated encryption)
chacha20poly1305 = "0.10"
rand = "0.9"
# Human-user authentication (password hashing)
argon2 = "0.5"
# Timestamps (audit records, token metadata)
chrono = { version = "0.4", features = ["serde"] }
