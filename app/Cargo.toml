[package]
name = "app"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "dopbase"
path = "src/main.rs"

[features]
default = []
embedded-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
# Async runtime (required by axum / sqlx)
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "net",
  "process",
  "io-util",
] }
# HTTP server / REST API
axum = "0.8"
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7", features = [
  "cors",
  "limit",
  "request-id",
  "set-header",
  "timeout",
  "trace",
  "util",
] }
# API Documentation
utoipa = { version = "5", features = ["axum_extras", "chrono", "ulid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
# SQLite driver, connection pool, and runtime migrations
sqlx = { version = "0.8", features = [
  "sqlite",
  "runtime-tokio",
  "migrate",
  "chrono",
] }
# CLI subcommands (serve, login, run, ...)
clap = { version = "4", features = ["derive"] }
# Serialization for the REST API
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
url = "2"
directories = "6"
# Field Validator
validator = { version = "0.21", features = ["derive"] }
# Authentication tokens
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
keyring = "3"
rpassword = "7"
# Typed error definitions (stable error shapes)
thiserror = "2"
# Envelope encryption (authenticated encryption)
chacha20poly1305 = "0.10"
rand = "0.9"
# Human-user authentication (password hashing)
argon2 = "0.5"
# Timestamps (audit records, token metadata)
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
async-trait = "0.1"
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
fs2 = "0.4"
getrandom = "0.3"
hex = "0.4"
mime_guess = { version = "2", optional = true }
regex = "1"
nix = { version = "0.30", features = ["signal", "process"] }
rust-embed = { version = "8", optional = true }
sha2 = "0.10"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "1", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
