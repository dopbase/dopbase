name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.0"
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.0"
  SMOKE_PORT: "18376"

jobs:
  prepare:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default "${RUST_VERSION}"

      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            version=$(jq -r '.version' package.json)
          fi
          bash scripts/release/validate-source.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app -> target
          key: prepare
          cache-workspace-crates: false

      - name: Check release scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" .github/workflows/release.yml
          shellcheck scripts/release/*.sh

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test and build frontend
        run: |
          bun run test:github
          bun run test:ui
          bun run test:docs
          bun run build:ui

      - name: Verify Rust application
        run: |
          bun run format:app:check
          bun run lint:app
          bun run test:app

      - name: Upload Admin UI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ui
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          previous_version="$(node scripts/github-templates.mjs previous-version \
            --version "${RELEASE_VERSION}" \
            --commit "${GITHUB_SHA}")"
          node scripts/github-templates.mjs render-release \
            --version "${RELEASE_VERSION}" \
            --previous-version "${previous_version}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output release-notes.md
          test -s release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.asset_os }} ${{ matrix.asset_arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset_os: linux
            asset_arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_os: linux
            asset_arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: amd64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: arm64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: amd64
            binary_name: dopbase.exe
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
      ASSET_OS: ${{ matrix.asset_os }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target "${{ matrix.target }}"
          rustup default "${RUST_VERSION}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app -> target
          key: release-${{ matrix.target }}
          cache-workspace-crates: false

      - name: Install musl compiler
        if: matrix.asset_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Download Admin UI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ui
          path: dist/

      - name: Test Windows installer
        if: matrix.asset_os == 'windows'
        shell: pwsh
        run: ./scripts/install.test.ps1

      - name: Build release binary
        shell: bash
        run: bash scripts/release/build-binary.sh "$RELEASE_TARGET"

      - name: Smoke-test release binary
        if: matrix.asset_os != 'windows'
        shell: bash
        run: bash scripts/release/smoke-test.sh "app/target/$RELEASE_TARGET/release/dopbase" "$RELEASE_VERSION"

      - name: Smoke-test Windows release binary
        if: matrix.asset_os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = "app/target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          $version = "${{ github.ref_name }}"
          $actualVersion = (& $binary --version).Trim()
          if ($actualVersion -ne "v$version") {
            throw "unexpected Dopbase version: $actualVersion"
          }

          $runtimeRoot = Join-Path $env:RUNNER_TEMP ("dopbase-smoke-" + [guid]::NewGuid())
          $dataDir = Join-Path $runtimeRoot "data"
          $serverLog = Join-Path $runtimeRoot "server.log"
          $serverError = Join-Path $runtimeRoot "server-error.log"
          New-Item -ItemType Directory -Path $runtimeRoot | Out-Null
          $bindAddress = "127.0.0.1:${{ env.SMOKE_PORT }}"
          $publicUrl = "http://${bindAddress}"
          $process = $null
          try {
            $process = Start-Process -FilePath $binary -ArgumentList @(
              "--data-dir", $dataDir,
              "server", "start",
              "--docs",
              "--host", "127.0.0.1",
              "--port", "${{ env.SMOKE_PORT }}",
              "--public-url", $publicUrl
            ) -RedirectStandardOutput $serverLog -RedirectStandardError $serverError -PassThru

            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                Invoke-RestMethod -Uri "$publicUrl/api/v1/health" | Out-Null
                $ready = $true
                break
              } catch {
                if ($process.HasExited) {
                  Get-Content $serverLog, $serverError -ErrorAction SilentlyContinue
                  throw "Dopbase exited before becoming ready"
                }
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) {
              Get-Content $serverLog, $serverError -ErrorAction SilentlyContinue
              throw "Dopbase did not become ready"
            }

            $health = Invoke-RestMethod -Uri "$publicUrl/api/v1/health"
            if ($health.success -ne $true -or $health.data.version -ne $version) {
              throw "unexpected health response"
            }
            $root = Invoke-WebRequest -UseBasicParsing -Uri "$publicUrl/"
            if ($root.Content -notmatch '<div id="app"></div>') {
              throw "embedded Admin UI is unavailable"
            }
            if (-not (Test-Path -LiteralPath (Join-Path $dataDir "dopbase.db"))) {
              throw "database file was not created"
            }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id
              $process.WaitForExit()
            }
            Remove-Item -Recurse -Force -LiteralPath $runtimeRoot -ErrorAction SilentlyContinue
          }

      - name: Package release archive
        if: matrix.asset_os != 'windows'
        shell: bash
        run: bash scripts/release/package-archive.sh "app/target/$RELEASE_TARGET/release/dopbase" "$RELEASE_VERSION" "$ASSET_OS" "$ASSET_ARCH" "$GITHUB_WORKSPACE"

      - name: Package Windows release archive
        if: matrix.asset_os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_VERSION
          $archive = "dopbase_${version}_${{ matrix.asset_os }}_${{ matrix.asset_arch }}.zip"
          $packageDir = Join-Path $env:RUNNER_TEMP ("dopbase-package-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item "app/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" (Join-Path $packageDir "dopbase.exe")
          Copy-Item CHANGELOG.md, LICENSE, NOTICE -Destination $packageDir
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $archive
          (Get-ChildItem -LiteralPath $packageDir).Name | Sort-Object

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dopbase_*.*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify release assets
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-*
          path: release/
          merge-multiple: true
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release/
      - name: Verify archives and generate checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release/verify-assets.sh "$RELEASE_VERSION" release
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release
          path: release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release
          path: release/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release/publish.sh "$RELEASE_VERSION" release
