name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.0"
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.0"
  SMOKE_PORT: "18376"

jobs:
  prepare:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default "${RUST_VERSION}"

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match MAJOR.MINOR.PATCH; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          release_version="${GITHUB_REF_NAME}"
          package_version="$(cargo metadata \
            --manifest-path app/Cargo.toml \
            --locked \
            --no-deps \
            --format-version 1 | jq -r '.packages[] | select(.name == "app") | .version')"
          frontend_version="$(jq -r '.version' package.json)"

          if [[ "${release_version}" != "${package_version}" ]]; then
            echo "Tag version ${release_version} does not match app version ${package_version}" >&2
            exit 1
          fi
          if [[ "${release_version}" != "${frontend_version}" ]]; then
            echo "Tag version ${release_version} does not match frontend version ${frontend_version}" >&2
            exit 1
          fi
          if ! grep --fixed-strings --quiet "## ${release_version} -" CHANGELOG.md; then
            echo "CHANGELOG.md has no release heading for ${release_version}" >&2
            exit 1
          fi

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test and build frontend
        run: |
          bunx vitest run --passWithNoTests
          bun run test:installer
          bun run build

      - name: Verify Rust application
        run: |
          cargo fmt --manifest-path app/Cargo.toml -- --check
          cargo clippy --manifest-path app/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path app/Cargo.toml --locked --all-targets
          cargo test --manifest-path app/Cargo.toml --locked --all-targets --all-features

      - name: Upload Admin UI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ui
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.asset_os }} ${{ matrix.asset_arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset_os: linux
            asset_arch: amd64
            binary_name: dopbase
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_os: linux
            asset_arch: arm64
            binary_name: dopbase
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: amd64
            binary_name: dopbase
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: arm64
            binary_name: dopbase
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: amd64
            binary_name: dopbase.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target "${{ matrix.target }}"
          rustup default "${RUST_VERSION}"

      - name: Install musl compiler
        if: matrix.asset_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Download Admin UI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ui
          path: dist/

      - name: Test Windows installer
        if: matrix.asset_os == 'windows'
        shell: pwsh
        run: ./scripts/install.test.ps1

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          if [[ "${{ matrix.asset_os }}" == "linux" ]]; then
            cc_var="CC_${target//-/_}"
            linker_var="CARGO_TARGET_${target//-/_}_LINKER"
            export "${cc_var}=musl-gcc"
            export "${linker_var^^}=musl-gcc"
          fi
          cargo build \
            --manifest-path app/Cargo.toml \
            --locked \
            --release \
            --target "${target}"

      - name: Smoke-test release binary
        if: matrix.asset_os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          binary="app/target/${{ matrix.target }}/release/dopbase"
          version="${GITHUB_REF_NAME}"
          bind_address="127.0.0.1:${SMOKE_PORT}"
          public_url="http://${bind_address}"
          test "$("${binary}" --version)" = "dopbase ${version}"

          runtime_root="$(mktemp -d)"
          data_dir="${runtime_root}/data"
          server_log="${runtime_root}/server.log"
          server_pid=""
          cleanup() {
            if [[ -n "${server_pid}" ]] && kill -0 "${server_pid}" 2>/dev/null; then
              kill -TERM "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
            rm -rf "${runtime_root}"
          }
          trap cleanup EXIT

          "${binary}" --data-dir "${data_dir}" serve \
            --docs \
            --bind-address "${bind_address}" \
            --public-url "${public_url}" \
            >"${server_log}" 2>&1 &
          server_pid=$!

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent "${public_url}/api/v1/health" >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${server_log}"
              exit 1
            fi
            sleep 0.25
          done
          if [[ "${ready}" != "true" ]]; then
            cat "${server_log}"
            exit 1
          fi

          health="$(curl --fail --silent "${public_url}/api/v1/health")"
          grep --quiet '"success":true' <<<"${health}"
          grep --quiet '"product":"dopbase"' <<<"${health}"
          grep --quiet "\"version\":\"${version}\"" <<<"${health}"
          grep --quiet '"apiVersion":"v1"' <<<"${health}"
          grep --quiet '"status":"ok"' <<<"${health}"
          curl --fail --silent "${public_url}/" | grep --quiet '<div id="app"></div>'
          curl --fail --silent "${public_url}/api/v1/openapi.json" | grep --quiet '"openapi"'
          curl --fail --silent --location "${public_url}/api/docs/" >/dev/null

          test -f "${data_dir}/dopbase.db"
          test -f "${data_dir}/master.key"
          test -f "${data_dir}/dopbase.db.lock"
          test ! -e "${runtime_root}/dopbase.db"
          grep --fixed-strings --quiet "Config:     ${data_dir}" "${server_log}"

          kill -TERM "${server_pid}"
          wait "${server_pid}"
          server_pid=""

      - name: Smoke-test Windows release binary
        if: matrix.asset_os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = "app/target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          $version = "${{ github.ref_name }}"
          $actualVersion = (& $binary --version).Trim()
          if ($actualVersion -ne "dopbase $version") {
            throw "unexpected Dopbase version: $actualVersion"
          }

          $runtimeRoot = Join-Path $env:RUNNER_TEMP ("dopbase-smoke-" + [guid]::NewGuid())
          $serverLog = Join-Path $runtimeRoot "server.log"
          $serverError = Join-Path $runtimeRoot "server-error.log"
          $dataDir = Join-Path $runtimeRoot "data"
          $publicUrl = "http://127.0.0.1:$env:SMOKE_PORT"
          New-Item -ItemType Directory -Path $runtimeRoot | Out-Null
          $process = $null
          try {
            $process = Start-Process -FilePath $binary -ArgumentList @(
              "--data-dir", $dataDir,
              "serve", "--docs", "--bind-address", "127.0.0.1:$env:SMOKE_PORT",
              "--public-url", $publicUrl
            ) -RedirectStandardOutput $serverLog -RedirectStandardError $serverError -PassThru

            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "$publicUrl/api/v1/health"
                $ready = $true
                break
              } catch {
                if ($process.HasExited) {
                  Get-Content $serverLog, $serverError -ErrorAction SilentlyContinue
                  throw "Dopbase exited before becoming ready"
                }
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) {
              throw "Dopbase did not become ready"
            }
            if (
              $health.success -ne $true -or
              $health.data.product -ne "dopbase" -or
              $health.data.version -ne $version -or
              $health.data.apiVersion -ne "v1" -or
              $health.data.status -ne "ok"
            ) {
              throw "unexpected health response"
            }
            $root = Invoke-WebRequest -UseBasicParsing -Uri "$publicUrl/"
            if ($root.Content -notmatch '<div id="app"></div>') {
              throw "embedded Admin UI is unavailable"
            }
            $openApi = Invoke-RestMethod -Uri "$publicUrl/api/v1/openapi.json"
            if (-not $openApi.openapi) {
              throw "OpenAPI document is unavailable"
            }
            Invoke-WebRequest -UseBasicParsing -Uri "$publicUrl/api/docs/" | Out-Null

            foreach ($file in @("dopbase.db", "master.key", "dopbase.db.lock")) {
              if (-not (Test-Path -LiteralPath (Join-Path $dataDir $file) -PathType Leaf)) {
                throw "runtime data file is missing: $file"
              }
            }
            if (Test-Path -LiteralPath (Join-Path $runtimeRoot "dopbase.db")) {
              throw "database was created outside the configured data directory"
            }
            if ((Get-Content -Raw -LiteralPath $serverError) -notmatch [regex]::Escape("Config:     $dataDir")) {
              throw "runtime log does not report the configured data directory"
            }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id
              $process.WaitForExit()
            }
            Remove-Item -Recurse -Force -LiteralPath $runtimeRoot -ErrorAction SilentlyContinue
          }

      - name: Package release archive
        if: matrix.asset_os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          archive="dopbase_${version}_${{ matrix.asset_os }}_${{ matrix.asset_arch }}.zip"
          package_dir="$(mktemp -d)"
          cp "app/target/${{ matrix.target }}/release/dopbase" "${package_dir}/dopbase"
          cp CHANGELOG.md LICENSE NOTICE "${package_dir}/"
          chmod 755 "${package_dir}/dopbase"
          (cd "${package_dir}" && zip -9 --quiet "${GITHUB_WORKSPACE}/${archive}" dopbase CHANGELOG.md LICENSE NOTICE)
          unzip -Z1 "${archive}" | sort

      - name: Package Windows release archive
        if: matrix.asset_os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.ref_name }}"
          $archive = "dopbase_${version}_${{ matrix.asset_os }}_${{ matrix.asset_arch }}.zip"
          $packageDir = Join-Path $env:RUNNER_TEMP ("dopbase-package-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item "app/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" (Join-Path $packageDir "dopbase.exe")
          Copy-Item CHANGELOG.md, LICENSE, NOTICE -Destination $packageDir
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $archive
          (Get-ChildItem -LiteralPath $packageDir).Name | Sort-Object

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dopbase_*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release/
          merge-multiple: true

      - name: Verify assets and generate checksums
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          expected=(
            "dopbase_${version}_darwin_amd64.zip"
            "dopbase_${version}_darwin_arm64.zip"
            "dopbase_${version}_linux_amd64.zip"
            "dopbase_${version}_linux_arm64.zip"
            "dopbase_${version}_windows_amd64.zip"
          )
          for archive in "${expected[@]}"; do
            test -f "${archive}"
          done
          test "$(find . -maxdepth 1 -name 'dopbase_*.zip' -type f | wc -l | tr -d ' ')" = "5"
          sha256sum "${expected[@]}" | sort -k2 > checksums.txt
          sha256sum --check checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${GH_REPO}"
          api_headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          curl --fail --silent --show-error \
            "${api_headers[@]}" \
            "${api_url}/git/ref/tags/${GITHUB_REF_NAME}" >/dev/null

          release_json="$(curl --silent --show-error \
            "${api_headers[@]}" \
            "${api_url}/releases/tags/${GITHUB_REF_NAME}" || true)"
          if ! jq -e '.id and .upload_url' >/dev/null <<<"${release_json}"; then
            release_json="$(curl --fail --silent --show-error \
              "${api_headers[@]}" \
              --request POST \
              --header 'Content-Type: application/json' \
              --data "$(jq -n \
                --arg tag "${GITHUB_REF_NAME}" \
                --arg target "${GITHUB_SHA}" \
                --arg name "${GITHUB_REF_NAME} Release" \
                '{tag_name: $tag, target_commitish: $target, name: $name, generate_release_notes: true}')" \
              "${api_url}/releases")"
          fi

          gh release upload \
            "${GITHUB_REF_NAME}" \
            release/* \
            --repo "${GH_REPO}" \
            --clobber
