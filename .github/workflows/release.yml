name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.0"
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.0"
  SMOKE_PORT: "18376"

jobs:
  prepare:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default "${RUST_VERSION}"

      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            version=$(jq -r '.version' package.json)
          fi
          bash scripts/release/validate-source.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0
        with:
          workspaces: app -> target
          key: prepare
          cache-workspace-crates: false

      - name: Check release scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" .github/workflows/release.yml
          shellcheck scripts/release/*.sh

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test and build frontend
        run: |
          bun run test:github
          bun run test:ui
          bun run test:docs
          bun run build:ui

      - name: Verify Rust application
        run: |
          bun run format:app:check
          bun run lint:app
          bun run test:app

      - name: Upload Admin UI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ui
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          previous_version="$(node scripts/github-templates.mjs previous-version \
            --version "${RELEASE_VERSION}" \
            --commit "${GITHUB_SHA}")"
          node scripts/github-templates.mjs render-release \
            --version "${RELEASE_VERSION}" \
            --previous-version "${previous_version}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output release-notes.md
          test -s release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.asset_os }} ${{ matrix.asset_arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset_os: linux
            asset_arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_os: linux
            asset_arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: amd64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
      ASSET_OS: ${{ matrix.asset_os }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target "${{ matrix.target }}"
          rustup default "${RUST_VERSION}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0
        with:
          workspaces: app -> target
          key: release-${{ matrix.target }}
          cache-workspace-crates: false

      - name: Install musl compiler
        if: matrix.asset_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Download Admin UI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ui
          path: dist/

      - name: Build release binary
        shell: bash
        run: bash scripts/release/build-binary.sh "$RELEASE_TARGET"

      - name: Smoke-test release binary
        shell: bash
        run: bash scripts/release/smoke-test.sh "app/target/$RELEASE_TARGET/release/dopbase" "$RELEASE_VERSION"

      - name: Package release archive
        shell: bash
        run: bash scripts/release/package-archive.sh "app/target/$RELEASE_TARGET/release/dopbase" "$RELEASE_VERSION" "$ASSET_OS" "$ASSET_ARCH" "$GITHUB_WORKSPACE"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dopbase_*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify release assets
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release/
          merge-multiple: true
      - name: Verify archives and generate checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release/verify-assets.sh "$RELEASE_VERSION" release
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release
          path: release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release
          path: release/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release/publish.sh "$RELEASE_VERSION" release
