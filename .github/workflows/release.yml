name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.0"
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.0"

jobs:
  prepare:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata \
            --manifest-path app/Cargo.toml \
            --locked \
            --no-deps \
            --format-version 1 | jq -r '.packages[] | select(.name == "app") | .version')"

          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Tag version ${tag_version} does not match app version ${package_version}" >&2
            exit 1
          fi

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test and build frontend
        run: |
          bunx vitest run --passWithNoTests
          bun run test:installer
          bun run build

      - name: Verify Rust application
        run: |
          cargo fmt --manifest-path app/Cargo.toml -- --check
          cargo clippy --manifest-path app/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path app/Cargo.toml --locked --all-targets
          cargo test --manifest-path app/Cargo.toml --locked --all-targets --all-features

      - name: Upload Admin UI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ui
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.asset_os }} ${{ matrix.asset_arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset_os: linux
            asset_arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_os: linux
            asset_arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: amd64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target "${{ matrix.target }}"
          rustup default "${RUST_VERSION}"

      - name: Install musl compiler
        if: matrix.asset_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Download Admin UI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ui
          path: dist/

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          if [[ "${{ matrix.asset_os }}" == "linux" ]]; then
            cc_var="CC_${target//-/_}"
            linker_var="CARGO_TARGET_${target//-/_}_LINKER"
            export "${cc_var}=musl-gcc"
            export "${linker_var^^}=musl-gcc"
          fi
          cargo build \
            --manifest-path app/Cargo.toml \
            --locked \
            --release \
            --features embedded-ui \
            --target "${target}"

      - name: Smoke-test release binary
        shell: bash
        run: |
          set -euo pipefail
          binary="app/target/${{ matrix.target }}/release/dopbase"
          version="${GITHUB_REF_NAME#v}"
          test "$("${binary}" --version)" = "dopbase ${version}"

          runtime_root="$(mktemp -d)"
          server_log="${runtime_root}/server.log"
          server_pid=""
          cleanup() {
            if [[ -n "${server_pid}" ]] && kill -0 "${server_pid}" 2>/dev/null; then
              kill -TERM "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
            rm -rf "${runtime_root}"
          }
          trap cleanup EXIT

          "${binary}" --data-dir "${runtime_root}/data" serve \
            --bind-address 127.0.0.1:18376 \
            --public-url http://127.0.0.1:18376 \
            >"${server_log}" 2>&1 &
          server_pid=$!

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18376/api/v1/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${server_log}"
              exit 1
            fi
            sleep 0.25
          done
          if [[ "${ready}" != "true" ]]; then
            cat "${server_log}"
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:18376/ | grep --quiet '<div id="app"></div>'
          curl --fail --silent http://127.0.0.1:18376/api/v1/health | grep --quiet "\"version\":\"${version}\""

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="dopbase_${version}_${{ matrix.asset_os }}_${{ matrix.asset_arch }}.zip"
          package_dir="$(mktemp -d)"
          cp "app/target/${{ matrix.target }}/release/dopbase" "${package_dir}/dopbase"
          cp CHANGELOG.md LICENSE NOTICE "${package_dir}/"
          chmod 755 "${package_dir}/dopbase"
          (cd "${package_dir}" && zip -9 --quiet "${GITHUB_WORKSPACE}/${archive}" dopbase CHANGELOG.md LICENSE NOTICE)
          unzip -Z1 "${archive}" | sort

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dopbase_*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release/
          merge-multiple: true

      - name: Verify assets and generate checksums
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "dopbase_${version}_darwin_amd64.zip"
            "dopbase_${version}_darwin_arm64.zip"
            "dopbase_${version}_linux_amd64.zip"
            "dopbase_${version}_linux_arm64.zip"
          )
          for archive in "${expected[@]}"; do
            test -f "${archive}"
          done
          test "$(find . -maxdepth 1 -name 'dopbase_*.zip' -type f | wc -l | tr -d ' ')" = "4"
          sha256sum "${expected[@]}" | sort -k2 > checksums.txt
          sha256sum --check checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME} Release"
