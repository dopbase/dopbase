name: PR template

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR template
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted validation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/github-templates.mjs validate-pr
