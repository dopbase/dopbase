name: Container image (arm64)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-arm64:
    name: Build and push arm64 GHCR image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read product version
        id: product
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' package.json)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve short commit SHA
        id: git
        shell: bash
        run: echo "short=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:main-arm64
            ghcr.io/${{ github.repository }}:latest-arm64
            ghcr.io/${{ github.repository }}:${{ steps.product.outputs.version }}-arm64
            ghcr.io/${{ github.repository }}:${{ steps.git.outputs.short }}-arm64
          cache-from: |
            type=gha,scope=arm64
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-arm64
          cache-to: |
            type=gha,mode=max,scope=arm64
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-arm64,mode=max
